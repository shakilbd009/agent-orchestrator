# .github/workflows/eval.yml — Phase 0 CI: static checks only
#
# Runs Phase 0-safe static checks on every push and PR.
# Phase 1+ jobs are gated on backend/frontend source existence.
#
# Phase 0 checks:
#   - graduation package completeness
#   - BRD open items tracking
#   - Feature flag registry integrity
#
# Phase 1+ checks (run only when backend/frontend exist):
#   - Go vet / build / test (backend)
#   - pnpm install + type-check + build + test (frontend)
#   - check-orchestrator-pipeline gate

name: Eval

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phase0-checks:
    name: Phase 0 static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for unexpected source code in Phase 0
        run: |
          # Phase 0 rule: no source code in backend/ or frontend/ BEFORE implementation exists.
          # After Phase 1+ implementation exists, this check is skipped.
          BACKEND_FILES=$(find backend -type f ! -name '.gitkeep' 2>/dev/null | wc -l | tr -d ' ')
          FRONTEND_FILES=$(find frontend -type f ! -name '.gitkeep' 2>/dev/null | wc -l | tr -d ' ')
          if [[ "$BACKEND_FILES" -gt 0 ]] || [[ "$FRONTEND_FILES" -gt 0 ]]; then
            echo "Phase 0 source-clean: SKIPPED (backend=$BACKEND_FILES frontend=$FRONTEND_FILES files present — Phase 1+ implementation exists)"
          else
            echo "Phase 0 source-clean: PASS (no source files)"
          fi

      - name: Run graduation package check
        env:
          PHASE: 1
        run: |
          echo "=== Phase 1 graduation package check ==="
          if [[ -f ./evals/architecture/check-graduation-package.sh ]]; then
            PHASE=1 ./evals/architecture/check-graduation-package.sh
          else
            echo "Graduation package script not yet created — skipping"
          fi

      - name: Run BRD open items check
        run: |
          echo "=== BRD open items check ==="
          if [[ -f ./evals/architecture/check-brd-open-items.sh ]]; then
            ./evals/architecture/check-brd-open-items.sh
          else
            echo "BRD open items script not yet created — skipping"
          fi

      - name: Run feature flags check
        run: |
          echo "=== Feature flags check ==="
          if [[ -f ./evals/architecture/check-feature-flags.sh ]]; then
            ./evals/architecture/check-feature-flags.sh
          else
            echo "Feature flags script not yet created — skipping"
          fi

      - name: Validate docker-compose.yml
        run: |
          if [[ -f docker-compose.yml ]]; then
            if command -v docker-compose >/dev/null 2>&1; then
              docker-compose config --quiet && echo "docker-compose.yml: valid"
            elif command -v docker >/dev/null 2>&1; then
              docker compose -f docker-compose.yml config --quiet && echo "docker-compose.yml: valid (docker compose)"
            else
              echo "docker/docker-compose not available — skipping validation"
            fi
          else
            echo "docker-compose.yml not present — skipping"
          fi

  phase1-backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    # Run if backend has source files; always run on push (main branch) after phase0 passes.
    if: |
      github.event_name == 'push' ||
      needs.phase0-checks.result == 'success'
    needs: phase0-checks
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o /dev/null ./...

      - name: Test
        run: go test ./...

  phase1-frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-latest
    needs: phase0-checks
    # Run if frontend has package.json; always run on push (main branch) after phase0 passes.
    if: |
      github.event_name == 'push' ||
      needs.phase0-checks.result == 'success'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec svelte-check --threshold warning

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

  phase1-feature-flags:
    name: Feature flag registry check
    runs-on: ubuntu-latest
    needs: phase0-checks
    # Run after phase0 static checks pass
    if: |
      github.event_name == 'push' ||
      needs.phase0-checks.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Run feature flag check
        run: |
          if [[ -f ./evals/architecture/check-feature-flags.sh ]]; then
            ./evals/architecture/check-feature-flags.sh
          else
            echo "Feature flags script not yet created — skipping"
          fi

# allow-merge: ensure all Phase 1+ jobs must pass before merge